desc: |
  Banana muffins with wheat bran. Yield: 12 standard muffins.

steps:
  - title: Preheat
    desc: Preheat the oven to 375°F. Use a non-stick muffin pan or paper cups.
    items: []

  - title: Mix dry ingredients
    desc: Add to a bowl and Whisk thoroughly. Stir in walnuts.
