  - title: Mix wet ingredients
    desc: Whisk together in a large bowl until mixed (lumps of banana are fine). Add the flour mixture and mix with a few light strokes. Don't overmix; the batter should not be smooth.
    items:
      - amount: 1
        unit: ""
