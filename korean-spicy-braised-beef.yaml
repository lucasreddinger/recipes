desc: "Instant-Pot Korean-style spicy beef made with a lean roast so the meat stays in chunks rather than naturally shredding. Finished with a bright red glaze."

steps:
  - title: Prep beef
    desc: Trim fat and cut into 1.5-inch chunks. Toss with salt and pepper, then toss in oil.  *Optionally* brown beef in a cast iron pan (you could sauté it in the Instant Pot, but you risk a "burn error"). Mix in chopped onions.
    items:
      - amount: 3.5
        unit: lb
        desc: sirloin tip roast
      - amount: 2
        unit: tsp
        desc: kosher salt
      - amount: 1
        unit: tsp
        desc: black pepper
      - amount: 1
        unit: Tbsp
        desc: neutral oil
      - amount: 2
        unit: ""
        desc: medium onions, chopped

  - title: Add liquid
    desc: |
      Place a trivet or silicone insert in the pot to keep the beef raised above the liquid.
    items:
      - amount: "3/4"
        unit: c
        desc: water
      - amount: 1
        unit: tsp
        desc: Better Than Bouillon roasted beef base
      - amount: "1/3"
        unit: c
        desc: soy sauce
      - amount: 2
        unit: Tbsp
        desc: Korean cooking wine or real mirin
      - amount: 2
        unit: Tbsp
        desc: rice vinegar
      - amount: 6
        unit: ""
        desc: garlic cloves, minced
      - amount: 1
        unit: Tbsp
        desc: fresh ginger, grated
      - amount: 3
        unit: ""
        desc: Thai chiles, sliced

  - title: Add beef, paste, and cook
    desc: |
      Add the beef mixture (with the chopped onions to help keep beef chunks separated). Top with paste made with these ingredients. Cook on high pressure for 20 minutes. Allow natural release for 10 minutes, then vent remaining pressure.
    items:
      - amount: 3
        unit: Tbsp
        desc: gochujang
      - amount: 2
        unit: Tbsp
        desc: coarse gochugaru
      - amount: 1
        unit: Tbsp
        desc: fine gochugaru
      - amount: 2
        unit: Tbsp
        desc: brown sugar
      - amount: 1
        unit: Tbsp
        desc: sesame oil

  - title: Finish glaze
    desc: |
      Remove the beef. Skim fat. If there is still a lot of liquid, pour some off before reducing. Set pot to sauté. Stir in these ingredients, then add the cornstarch+water slurry and simmer until glossy. Return the beef and toss to coat. Serve over rice with [oi muchim](https://www.lipidless.com/recipes/oi-muchim).
    items:
      - amount: 1
        unit: Tbsp
        desc: gochujang
      - amount: 1
        unit: Tbsp
        desc: ketchup
      - amount: 1
        unit: Tbsp
        desc: honey or rice syrup
      - amount: 1
        unit: tsp
        desc: rice vinegar
      - amount: 1
        unit: Tbsp
        desc: cornstarch
      - amount: 1
        unit: Tbsp
        desc: cold water

notes:
  - title: Beef cut
    desc: I like top sirloin, sirloin tip, and similar lean beef because they are relatively low in fat and stay in solid chunks. If you want beef that is more tender, use chuck roast or another fattier braising cut.

  - title: Heat
    desc: Add more Thai chiles for more heat.
