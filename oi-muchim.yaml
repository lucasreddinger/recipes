desc: Quick spicy cucumber salad. Extra bright and salty for garnishing umami-rich dishes.

steps:
  - title: Salt cucumbers
    desc: Thinly slice. Toss with salt and set aside 15 minutes.
    items:
      - amount: 2
        unit: ""
        desc: cucumbers, sliced
      - amount: 1
        unit: t
        desc: kosher salt

  - title: Season
    desc: Drain well, but do not squeeze. Add remaining ingredients and mix thoroughly. Let sit 5 minutes if desired.
    items:
