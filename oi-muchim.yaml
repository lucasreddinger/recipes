        unit: t
        desc: toasted sesame seeds
      - amount: 1
        unit: t
        desc: toasted sesame oil

notes:
  - title: Reference
    desc: |
      Adapted from [Korean Bapsang's oi muchim](https://www.koreanbapsang.com/oi-muchim-korean-style-cucumber-salad/); I use more vinegar and add soy sauce.
